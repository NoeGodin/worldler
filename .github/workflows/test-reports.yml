name: Test Reports & Deploy

on:
  push:
    branches: [ "main", "master", "maxime/MutationTest" ]

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Tests, JaCoCo and Pitest
        run: ./gradlew jacocoTestReport pitest

      - name: Prepare Report Site
        if: always()
        run: |
          mkdir -p public/coverage
          mkdir -p public/mutation
          
          if [ -d "build/reports/jacoco/test/html" ]; then
            cp -r build/reports/jacoco/test/html/* public/coverage/
          fi
          
          if [ -d "build/reports/pitest" ]; then
            cp -r build/reports/pitest/* public/mutation/
          fi
          
          echo '<html><body><h1>Rapports de Tests</h1><ul><li><a href="coverage/index.html">Rapport de Couverture (JaCoCo)</a></li><li><a href="mutation/index.html">Rapport de Mutation (Pitest)</a></li></ul></body></html>' > public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true