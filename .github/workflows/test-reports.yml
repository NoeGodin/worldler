name: Test Reports & Deploy

on:
  push:
    branches: [ "main", "master", "maxime/MutationTest" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Tests (with Allure generation)
        run: ./gradlew test jacocoTestReport pitest

      - name: Load Test Report History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          echo "$(pwd)/allure-2.27.0/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        run: allure generate build/allure-results --clean -o allure-report

      - name: Prepare Combined Report Site
        if: always()
        run: |
          mkdir -p public/coverage
          mkdir -p public/mutation
          
          # Copie du rapport Allure
          if [ -d "allure-report" ]; then
            cp -r allure-report/* public/
          fi

          # Copie du rapport JaCoCo
          if [ -d "build/reports/jacoco/test/html" ]; then
            cp -r build/reports/jacoco/test/html/* public/coverage/
          fi
          
          # Copie du rapport Pitest
          if [ -d "build/reports/pitest" ]; then
            cp -r build/reports/pitest/* public/mutation/
          fi
          
          # Création de la page d'accueil
          # On renomme l'index Allure pour en faire un sous-lien
          if [ -f "public/index.html" ]; then
            mv public/index.html public/allure-index.html
          fi
          
          echo '<html>
          <head><title>Rapports Worlder</title><style>body{font-family:sans-serif;padding:2rem;text-align:center} a{display:block;margin:1rem;padding:1rem;background:#f0f0f0;text-decoration:none;color:#333;border-radius:5px} a:hover{background:#e0e0e0}</style></head>
          <body>
            <h1>Rapports de Tests Worlder</h1>
            <a href="allure-index.html">📊 Rapport Allure (Tests & Historique)</a>
            <a href="coverage/index.html">🎯 Rapport de Couverture (JaCoCo)</a>
            <a href="mutation/index.html">🧬 Rapport de Mutation (Pitest)</a>
          </body>
          </html>' > public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true